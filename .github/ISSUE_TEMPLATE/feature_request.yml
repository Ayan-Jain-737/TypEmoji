name: Feature Request
description: Suggest an idea or enhancement for TypEmoji
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for TypEmoji! Please fill out the sections below to explain your idea and context.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Context
      description: Is your feature request related to a problem or limitation? Please describe the scenario you are trying to address.
      placeholder: "I am always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen and how it should behave.
      placeholder: "Add support for..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions, tools, or workarounds you have considered.
      placeholder: "I tried using..."
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context or Screenshots
      description: Add any other context, mockups, or screenshots about the feature request here.
