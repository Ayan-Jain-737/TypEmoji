name: Build Multi-Distro Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ubuntu:
    name: Build .deb & Universal .run
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ qt6-base-dev qt6-tools-dev \
            libx11-dev libxtst-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_KDE=OFF

      - name: Build
        run: |
          cmake --build build

      - name: Package .deb and .tar.gz
        run: |
          cd build
          cpack -G "DEB;TGZ"

      - name: Build Universal .run Installer
        run: |
          chmod +x scripts/create-installer.sh
          ./scripts/create-installer.sh

      - name: Rename Packages for Clarity
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="2.3.1"
          DEB=$(find build -name "*.deb" | head -n 1)
          [ -n "$DEB" ] && cp "$DEB" "dist/TypEmoji-${VERSION}-Ubuntu-Debian-x86_64.deb"
          RUN=$(find build -name "*.run" | head -n 1)
          [ -n "$RUN" ] && cp "$RUN" "dist/TypEmoji-${VERSION}-Universal-Installer.run"
          TGZ=$(find build -name "*.tar.gz" | head -n 1)
          [ -n "$TGZ" ] && cp "$TGZ" "dist/TypEmoji-${VERSION}-Portable-Linux-x86_64.tar.gz"
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-and-run-packages
          path: dist/*

  build-fedora:
    name: Build Fedora .rpm
    runs-on: ubuntu-latest
    container:
      image: fedora:40
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git cmake ninja-build gcc-c++ rpm-build \
            qt6-qtbase-devel qt6-qttools-devel \
            kf6-kglobalaccel-devel kf6-kxmlgui-devel \
            libX11-devel libXtst-devel

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build RPM
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cd build
          cpack -G RPM
          mkdir -p ../dist
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="2.3.1"
          RPM=$(find . -name "*.rpm" | head -n 1)
          [ -n "$RPM" ] && cp "$RPM" "../dist/TypEmoji-${VERSION}-Fedora-openSUSE-x86_64.rpm"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*

  build-arch:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Prepare Arch environment
        run: |
          pacman -Syu --noconfirm base-devel git cmake ninja gcc qt6-base qt6-tools kglobalaccel kxmlgui libxtst libx11
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Arch package
        run: |
          chown -R builder:builder .
          su builder -c "
            mkdir -p /tmp/pkgbuild
            cp -r . /tmp/pkgbuild/
            cd /tmp/pkgbuild/packaging
            sed -i 's/source=(.*)/source=()/g' PKGBUILD
            sed -i 's/sha256sums=(.*)/sha256sums=()/g' PKGBUILD
            sed -i 's|\$pkgname-\$pkgver|/tmp/pkgbuild|g' PKGBUILD
            makepkg -s --noconfirm
          "
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="2.3.1"
          PKG=$(find /tmp/pkgbuild/packaging -name "emojityper-2*.pkg.tar.zst" ! -name "*-debug*" | head -n 1)
          if [ -n "$PKG" ]; then
            cp "$PKG" "dist/TypEmoji-${VERSION}-Arch-Linux-x86_64.pkg.tar.zst"
          fi
          ls -la dist/

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*

  release:
    name: Publish Release Packages
    needs: [build-ubuntu, build-fedora, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
