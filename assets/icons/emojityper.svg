<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>
    <radialGradient id="faceGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="70%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Emoji Face -->
  <circle cx="64" cy="64" r="40" fill="url(#faceGrad)" />

  <!-- Eyes -->
  <ellipse cx="50" cy="54" rx="5" ry="7" fill="#3e2723" />
  <ellipse cx="78" cy="54" rx="5" ry="7" fill="#3e2723" />
  
  <!-- Eye highlights -->
  <circle cx="48.5" cy="51.5" r="2" fill="#ffffff" />
  <circle cx="76.5" cy="51.5" r="2" fill="#ffffff" />

  <!-- Smile -->
  <path d="M 46 72 Q 64 92 82 72 Q 64 80 46 72 Z" fill="#b71c1c" />
  <path d="M 52 74 Q 64 86 76 74" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>
