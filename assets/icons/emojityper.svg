<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Subtle Inner Border Highlight -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- 3D Emoji Face Radial Gradient -->
    <radialGradient id="faceGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="35%" stop-color="#FDD835" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Face Specular Highlight -->
    <linearGradient id="faceHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Sparkle Star Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="squircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="faceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="url(#squircleShadow)" />
  <rect x="10.5" y="10.5" width="107" height="107" rx="27.5" fill="none" stroke="url(#innerGlow)" stroke-width="1.5" />

  <!-- Emoji Face Group with Shadow -->
  <g filter="url(#faceShadow)">
    <circle cx="64" cy="65" r="38" fill="url(#faceGrad)" />
    <!-- Subtle Top Sheen -->
    <ellipse cx="64" cy="40" rx="22" ry="11" fill="url(#faceHighlight)" />
  </g>

  <!-- Cheerful Eyes (Happy Crescent / Arcs) -->
  <path d="M 46 54 C 47 47, 57 47, 58 54" stroke="#451A03" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 70 54 C 71 47, 81 47, 82 54" stroke="#451A03" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <ellipse cx="44" cy="67" rx="6" ry="3.5" fill="#EF4444" opacity="0.35" />
  <ellipse cx="84" cy="67" rx="6" ry="3.5" fill="#EF4444" opacity="0.35" />

  <!-- Big Joyful Smile with Teeth & Tongue -->
  <g>
    <!-- Mouth Base -->
    <path d="M 46 68 Q 64 96 82 68 Z" fill="#78350F" />
    <!-- White Teeth -->
    <path d="M 47.5 69 Q 64 78 80.5 69 Q 64 82 47.5 69 Z" fill="#FFFFFF" />
    <!-- Pink Tongue -->
    <path d="M 54 84 Q 64 78 74 84 Q 64 96 54 84 Z" fill="#F43F5E" />
  </g>

  <!-- Magic Sparkles (Top Right) -->
  <g transform="translate(86, 16)">
    <!-- Big Sparkle 4-point star -->
    <path d="M 14 0 Q 14 14 28 14 Q 14 14 14 28 Q 14 14 0 14 Q 14 14 14 0 Z" fill="url(#sparkleGrad)" filter="url(#faceShadow)" />
    <!-- Small Companion Sparkle -->
    <path d="M 0 24 Q 0 29 5 29 Q 0 29 0 34 Q 0 29 -5 29 Q 0 29 0 24 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
